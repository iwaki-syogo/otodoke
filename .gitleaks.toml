# Otodoke gitleaks config: default rules + provider keys this project uses.
title = "otodoke"

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_\-]{20,}'''

[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''\bre_[A-Za-z0-9]{20,}\b'''

[allowlist]
paths = [
  '''package-lock\.json''',
  # Made-up keys for the envelope test vectors (scripts/crypto-vectors.ts). They protect nothing.
  '''^fixtures/crypto/envelope-v1\.json$''',
  # Made-up secrets for the password-v1 test vectors (scripts/crypto-password-v1-vectors.ts). They protect nothing.
  '''^fixtures/crypto/password-v1\.json$''',
]
