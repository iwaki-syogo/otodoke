<!doctype html>
<html lang="ja">
  <body style="margin:0;padding:24px;background:#fafaf9;color:#1c1917;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e7e5e4;border-radius:16px;padding:24px;">
      <p style="margin:0 0 16px;font-size:18px;font-weight:700;">Otodoke にログイン</p>
      <p style="margin:0 0 24px;font-size:14px;line-height:1.7;">下のボタンを押すとログインできます。リンクとコードは 1 時間有効です。</p>
      <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:block;padding:14px;border-radius:12px;background:#171717;color:#ffffff;font-size:15px;text-align:center;text-decoration:none;">ログインする</a>
      <p style="margin:24px 0 8px;font-size:14px;line-height:1.7;">アプリでは、このコードを入力してください。</p>
      <p style="margin:0;font-size:28px;font-weight:700;letter-spacing:4px;font-family:ui-monospace,Menlo,monospace;">{{ .Token }}</p>
      <p style="margin:24px 0 0;font-size:12px;line-height:1.7;color:#78716c;">心当たりがない場合は、このメールを無視してください。</p>
    </div>
  </body>
</html>
